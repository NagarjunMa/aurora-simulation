[project]
name = "workspace"
version = "0.1.0"
description = "A live coding assignment API for simulating independent state trajectories"
readme = "README.md"
authors = [
    { name = "NagarjunMa", email = "mallesh.n@northeastern.edu" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.143.1",
    "pydantic>=2.14.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "httpx2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
